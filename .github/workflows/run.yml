
name: 每日微信运动步数更新

on:
  schedule:
    - cron: '30 22 * * *'
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: python -m pip install requests pytz

      - name: 更新步数
        env:
          CONFIG: ${{ secrets.CONFIG }}
        run: python main.py
